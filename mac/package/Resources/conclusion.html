  <h2>Open Crayon</h2>
  <p>Launch Rhino 8, open a model and type <b>Crayon</b> in the command line. Use the Sketch tab to draw, or choose an assistant in the Agent tab and sign in.</p>
  <p>Setup logs are in <code>~/Library/Logs/Crayon</code>.</p>
