<body data-mode="{{MODE}}">
<div id="shell">
 <div class="header"><div class="lockup">{{LOGO}}<span class="wordmark">crayon</span></div><button id="power" class="power" data-act="power" role="switch" aria-label="Crayon" aria-checked="false" title="Turn Crayon on"><i></i></button></div>
 <div class="tabs" role="tablist" aria-label="Crayon panel"><button role="tab" data-act="tab" data-value="agent" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M18 5C8-2 0 11 6 18c5 7 16 0 14-7-1-5-10-5-10 1 0 3 4 4 6 1"/><circle cx="15.5" cy="11.5" r="1" fill="currentColor"/></svg>Agent</button><button role="tab" data-act="tab" data-value="sketch" aria-selected="false"><svg viewBox="0 0 24 24"><path d="m5 16-1 4 4-1L20 7l-3-3Z M14 7l3 3 M11 21h9"/></svg>Sketch</button><button role="tab" data-act="tab" data-value="layers" aria-selected="false"><svg viewBox="0 0 24 24"><path d="m3 8 9-5 9 5-9 5Z M3 12l9 5 9-5 M3 16l9 5 9-5"/></svg>Layers</button></div>
</div>
<main id="main">
<div id="sketch">
 <details class="brush-select" id="brushMenu"><summary aria-label="Choose brush type"><svg class="brush-sample" viewBox="0 0 76 22"><path d="M4 16C18 0 27 2 38 11s21 10 34-5" stroke-width="5"/></svg><span id="brushName">Crayon</span><svg class="brush-arrow" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></summary><div class="brush-menu"><button data-act="preset" data-value="crayon">Crayon</button><button data-act="preset" data-value="pencil">Pencil</button><button data-act="preset" data-value="marker">Marker</button><button data-act="preset" data-value="soft">Soft brush</button></div></details>
 <div id="strokeSection"><div class="section-body"><div class="field"><span class="label">Colour</span><div class="swatches" id="swatches"></div></div><div id="ranges"></div></div></div>
</div>
<div id="layers" hidden>
<div class="layer-options"><button class="layer-toggle" data-act="activeOnly" role="switch" aria-checked="true">Context only from active group<i></i></button><button class="layer-toggle" data-act="newGroup" role="switch" aria-checked="true">New group for new prompt<i></i></button><button class="layer-toggle" data-act="hideUsed" role="switch" aria-checked="true">Visibility off after context used<i></i></button></div>
<input id="search" class="search" type="search" placeholder="Find sketches and comments" aria-label="Find sketches and comments">
<details open><summary>Sketches<small id="sketchCount"></small></summary><div id="sketchList"></div></details><details open><summary>Comments<small id="commentCount"></small></summary><div id="commentList"></div></details><p class="document" id="document"></p></div>
</main>
<script>
(function(){'use strict';
var $=function(id){return document.getElementById(id)}, header=document.body.dataset.mode==='header', S={tab:'agent',active:false,dark:false}, queue=[], layersSignature='';
$('shell').hidden=!header;$('main').hidden=header;
function post(type,value,more){var a=more||{};a.type=type;a.value=String(value==null?'':value);queue.push(a)}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
var check='<svg viewBox="0 0 24 24"><path d="M4 13c2 1 3 3 4 5C12 10 16 5 22 2"/></svg>',eye='<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',trash='<svg viewBox="0 0 24 24"><path d="M4 6h16 M9 6V3h6v3 M6 6l1 15h10l1-15 M10 10v7 M14 10v7"/></svg>',select='<svg viewBox="0 0 24 24"><path d="m5 3 14 10-7 1-4 7Z"/></svg>';
document.querySelectorAll('.check i').forEach(function(e){e.innerHTML=check});
var palette=['#23262C','#235ED1','#D6322B','#11865D','#8855F7'];
$('swatches').innerHTML=palette.map(function(c){return '<button class="swatch" style="--c:'+c+'" data-act="color" data-value="'+c+'" title="'+c+'" aria-label="Use '+c+'" aria-pressed="false"></button>'}).join('')+'<label class="color-wheel" title="Choose colour"><input id="color" type="color" aria-label="Sketch colour"></label>';
var ranges=[['size','Size',1,40,'px'],['opacity','Opacity',10,100,'%'],['hardness','Hardness',0,100,'%']];
$('ranges').innerHTML=ranges.map(function(r){return '<div class="field"><label for="'+r[0]+'">'+r[1]+'</label><input id="'+r[0]+'" type="range" min="'+r[2]+'" max="'+r[3]+'" step="1"><output id="'+r[0]+'Out"></output><button class="sensitivity" data-act="'+r[0]+'Pressure" aria-pressed="false" aria-label="Pressure sensitivity for '+r[1].toLowerCase()+'" title="Pressure sensitivity for '+r[1].toLowerCase()+'"><svg viewBox="0 0 24 24"><path d="m7 14-1 4 4-1L20 7l-3-3Z M14 7l3 3 M3 22c3-5 5 1 9-3"/></svg></button></div>'}).join('');
function setValue(el,value){if(document.activeElement!==el)el.value=value}
function segment(id,value){$(id).querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.value===String(value)))})}
function render(){document.documentElement.classList.toggle('dark',!!S.dark);$('power').setAttribute('aria-checked',String(!!S.active));$('power').title=S.active?'Turn Crayon off':'Turn Crayon on';document.querySelectorAll('[role=tab]').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.value===S.tab))});if(header)return;
$('sketch').hidden=S.tab!=='sketch';$('layers').hidden=S.tab!=='layers';if(S.tab==='layers'){renderLayers();return}
$('brushName').textContent=({crayon:'Crayon',pencil:'Pencil',marker:'Marker',soft:'Soft brush'})[S.preset]||'Crayon';document.querySelector('.brush-sample').style.color=S.color||'#9731b0';document.querySelectorAll('.sensitivity').forEach(function(b){b.setAttribute('aria-pressed',String(!!S[b.dataset.act]))});
ranges.forEach(function(r){setValue($(r[0]),Math.round(S[r[0]]||0));$(r[0]+'Out').textContent=Math.round(S[r[0]]||0)+(r[4]==='px'?' px':'%')});document.querySelectorAll('.check').forEach(function(b){b.setAttribute('aria-checked',String(!!S[b.dataset.act]))});setValue($('color'),S.color||'#9731b0');document.querySelector('.color-wheel').style.setProperty('--color',S.color||'#9731b0');document.querySelectorAll('.swatch').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.value.toLowerCase()===(S.color||'').toLowerCase()))});}
var groupOpen={}, groupDocument=null;
var eyeOff='<svg viewBox="0 0 24 24"><path d="m3 3 18 18M10 5a12 12 0 0 1 12 7 17 17 0 0 1-4 5M6 6a18 18 0 0 0-4 6s4 7 10 7c2 0 3-1 4-1M10 10a3 3 0 0 0 4 4"/></svg>';
function visibility(action,id,visible,label){return '<button class="visibility" data-act="'+action+'" data-value="'+esc(id)+'" aria-pressed="'+!!visible+'" title="'+(visible?'Hide ':'Show ')+esc(label)+'" aria-label="'+(visible?'Hide ':'Show ')+esc(label)+'">'+(visible?eye:eyeOff)+'</button>'}
function annotationRow(x,kind){var name=kind==='sketch'?x.name:'Comment '+x.number;
var content=kind==='sketch'?'<i class="dot" style="--c:'+esc(x.color)+'"></i><div class="name"><input data-rename="'+esc(x.id)+'" value="'+esc(name)+'" aria-label="Stroke name" title="Rename stroke"></div>':'<span class="comment-number">'+esc(x.number)+'</span><span class="comment-text" title="'+esc(x.text)+'">'+esc(x.text)+'</span>';
return '<div class="item'+(x.visible?'':' off-item')+'">'+content+(kind==='sketch'?'<button class="icon-button" data-act="select" data-value="'+esc(x.id)+'" aria-label="Select '+esc(name)+'" title="Select stroke" '+(x.overlay?'disabled':'')+'>'+select+'</button>':'')+visibility('visible',x.id,x.ownVisible!==false,name)+'<button class="icon-button danger" data-act="delete" data-value="'+esc(x.id)+'" title="Delete '+esc(name)+'" aria-label="Delete '+esc(name)+'">'+trash+'</button></div>'}
function groupList(kind,groups,items,query){return groups.map(function(g){var key=kind+':'+g.id,matchGroup=g.name.toLowerCase().indexOf(query)!==-1;
var members=items.filter(function(x){return (x.group||1)===g.id&&(matchGroup||String(x.name||x.text||'').toLowerCase().indexOf(query)!==-1)});if(query&&!matchGroup&&!members.length)return '';
return '<details class="item-group" data-group="'+key+'" '+((groupOpen[key]||query)?'open':'')+'><summary><button class="group-active" data-act="groupActive" data-value="'+key+'" role="checkbox" aria-checked="'+!!g.active+'" title="Use '+esc(g.name)+' for new '+(kind==='sketch'?'strokes':'comments')+'" aria-label="Active '+kind+' '+esc(g.name)+'">'+check+'</button><span class="group-name">'+esc(g.name)+'</span><small>'+members.length+'</small>'+visibility('groupVisible',key,g.visible,g.name)+'</summary><div class="group-items">'+(members.map(function(x){return annotationRow(x,kind)}).join('')||'<div class="empty">No '+(kind==='sketch'?'strokes':'comments')+' yet.</div>')+'</div></details>'}).join('')||'<div class="empty">No matching groups.</div>'}
function renderLayers(){var query=$('search').value.toLowerCase(),sig=JSON.stringify([S.sketches,S.comments,S.sketchGroups,S.commentGroups,S.activeOnly,S.newGroup,S.hideUsed,S.documentId,query]);if(sig===layersSignature)return;layersSignature=sig;if(groupDocument!==S.documentId){groupOpen={};groupDocument=S.documentId}
document.querySelector('[data-act=activeOnly]').setAttribute('aria-checked',String(S.activeOnly!==false));document.querySelector('[data-act=newGroup]').setAttribute('aria-checked',String(S.newGroup!==false));document.querySelector('[data-act=hideUsed]').setAttribute('aria-checked',String(S.hideUsed!==false));var fallback=[{id:1,name:'Group 1',visible:true,active:true}];$('sketchCount').textContent=(S.sketches||[]).length;$('commentCount').textContent=(S.comments||[]).length;$('sketchList').innerHTML=groupList('sketch',S.sketchGroups||fallback,S.sketches||[],query);$('commentList').innerHTML=groupList('comment',S.commentGroups||fallback,S.comments||[],query);$('document').textContent=S.document||'Untitled Rhino model'}
document.addEventListener('toggle',function(e){if(e.target.dataset.group&&document.contains(e.target)&&!$('search').value)groupOpen[e.target.dataset.group]=e.target.open},true);
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(b){if(b.closest('summary')){e.preventDefault();e.stopPropagation()}post(b.dataset.act,b.dataset.value);if(b.dataset.act==='preset'){$('brushMenu').open=false}}});ranges.forEach(function(r){$(r[0]).addEventListener('input',function(){S[r[0]]=Number(this.value);post('brush',r[0],{number:Number(this.value)});render()})});$('color').addEventListener('input',function(){S.color=this.value;post('color',this.value);render()});$('search').addEventListener('input',renderLayers);document.addEventListener('change',function(e){if(e.target.dataset.rename)post('rename',e.target.dataset.rename,{name:e.target.value})});document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.dataset.rename)e.target.blur()});
document.addEventListener('click',function(e){if(!e.target.closest('#brushMenu'))$('brushMenu').open=false});document.addEventListener('keydown',function(e){if(e.key==='Escape')$('brushMenu').open=false});window.crayonSidebar={state:function(s){S=s;render()},take:function(){if(!queue.length)return '';var taken=queue;queue=[];return encodeURIComponent(JSON.stringify(taken))}};
})();
</script></body></html>
