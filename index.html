<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Intelligence | AEC TECH Hackathon</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <script src="harold.js" defer></script>
    <!-- Draw/Clear tools retained for later: <script src="drawing-tools.js" defer></script> -->
  </head>
  <body>
    <header class="site-header">
      <div class="header-credits">
        <ul class="team" aria-label="Team members">
          <li>Varun</li>
          <li>Anmol</li>
          <li>Ansh</li>
          <li>Kevin</li>
        </ul>
        <div class="event-name" aria-label="AEC TECH Hackathon">
          <span class="event-logo"><span class="aec">AEC</span> TECH</span>
          <span class="event-label">Hackathon</span>
        </div>
      </div>
      <h1 aria-label="Crayon: Drawing Intelligence"><span class="crayon-brand"><img class="crayon-initial" src="assets/crayon-download.svg" alt="C"><span class="brand-letters">RAYON</span></span>: <span class="title-subtitle">DRAWING INTELLIGENCE</span></h1>
      <a class="header-download" href="#slide-4">Download Crayon Now!</a>
    </header>
    <main id="main-content" aria-label="Presentation slides" tabindex="0">
      <section class="slide video-grid" id="slide-0" aria-label="Slide 0: Drawing videos">
        <video src="videos/harold%201.mp4" autoplay muted loop playsinline aria-label="Drawing video 1"></video>
        <video src="videos/harold%202.mp4" autoplay muted loop playsinline aria-label="Drawing video 2"></video>
        <video src="videos/harold%203.mp4" autoplay muted loop playsinline aria-label="Drawing video 3"></video>
        <video src="videos/harold%204.mp4" autoplay muted loop playsinline aria-label="Drawing video 4"></video>
      </section>
      <section class="slide modelling-slide" id="slide-1" aria-label="Slide 1: Plugin tools and UI">
        <video src="videos/UI-clip-1.mp4" autoplay muted loop playsinline preload="metadata" aria-label="Crayon plugin tools and UI"></video>
      </section>
      <section class="slide modelling-slide" id="slide-2" aria-label="Slide 2: How the tools are used">
        <video src="videos/tools-functioning-clip1.mp4" autoplay muted loop playsinline preload="metadata" aria-label="Crayon tools in use"></video>
      </section>
      <section class="slide modelling-slide" id="slide-3" aria-label="Slide 3: Vibe modelling">
        <video src="videos/vibe-modelling-house-site-fast.mp4" data-playback-rate="0.75" autoplay muted loop playsinline preload="metadata" aria-label="Vibe modelling a house and site"></video>
      </section>
      <section class="slide download-slide" id="slide-4" aria-labelledby="slide-4-title" tabindex="-1">
        <canvas class="harold-background" aria-hidden="true"></canvas>
        <!-- Draw/Clear tools disabled; markup retained for later.
        <canvas class="drawing-canvas" id="slide-4-drawing" aria-label="Your drawings on slide 4"></canvas>
        <div class="drawing-tools" role="group" aria-label="Drawing tools">
          <button type="button" data-drawing-tool="draw" aria-pressed="false" aria-controls="slide-4-drawing" title="Draw. Click again or press Escape to stop.">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m15 4 5 5M4 20l1-6L16 3a2 2 0 0 1 3 0l2 2a2 2 0 0 1 0 3L10 19l-6 1Z" />
              <path d="m5 14 5 5" />
            </svg>
            <span>Draw</span>
          </button>
          <button type="button" data-drawing-tool="clear" aria-controls="slide-4-drawing" title="Clear drawing">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m14 3 7 7a1.5 1.5 0 0 1 0 2l-8 8H7l-5-5a1.5 1.5 0 0 1 0-2L12 3a1.5 1.5 0 0 1 2 0Z" />
              <path d="m8 7 9 9M13 20h9" />
            </svg>
            <span>Clear</span>
          </button>
        </div>
        -->
        <div class="download-content">

          <h2 id="slide-4-title"><span class="download-title-prefix">Get</span> <span class="crayon-brand">CRAYON</span>.</h2>
          <p class="download-description">Draw your imagination in Rhino!</p>
          <div class="download-buttons">
            <a class="download-button" href="wizard/dist/CrayonSetup.exe" download="CrayonSetup.exe" aria-label="Download Crayon for Windows">
              <img src="assets/crayon-download.svg" width="28" height="28" alt="">
              <span data-release-version hidden></span>
              <span>Download for</span>
              <img src="assets/windows-grey.png" width="28" height="28" alt="">
            </a>
          </div>
          <p class="download-instruction">Use command "<strong>Crayon</strong>" in Rhino to activate the tool!</p>

        </div>
      </section>
    </main>
  </body>
</html>
